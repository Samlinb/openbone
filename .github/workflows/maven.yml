name: Maven Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
        cache: maven

    - name: Verify with Maven
      if: github.event_name != 'release'
      run: xvfb-run -a mvn -B verify --file pom.xml

    - name: Build and Publish with Maven
      if: github.event_name == 'release'
      run: xvfb-run -a mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml --file pom.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

   
    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: target/openbone-*.jar
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build self-contained Windows packages
      shell: pwsh
      run: ./scripts/package-windows.ps1
    - name: Verify without system Java
      shell: pwsh
      run: ./scripts/verify-windows-package.ps1
    - uses: actions/upload-artifact@v4
      with:
        name: Openbone-windows-x64
        path: target/dist/*
        if-no-files-found: error
    - name: Upload Windows release assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: target/dist/*
        fail_on_unmatched_files: true
