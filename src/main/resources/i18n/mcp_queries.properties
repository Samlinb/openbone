description=Read a revision-consistent page of bones, animations, keyframes, slots, attachments or constraints. Keyframes default to bone tracks; trackType selects all, non_bone, bone, deform, constraint, slot_color, attachment, draw_order or event. Optional targetId and channel filter before pagination. IDs are UUIDs; time is seconds. Bone transforms are relative to Setup; deform values are local XY offsets (per influence when weighted); constraint and color values are absolute. Curves describe outgoing segments. Discrete attachment/order keys are stepped; events are instantaneous.
keyframeFilters=trackType, targetId and channel are only valid for kind keyframes.
trackType=Unknown trackType. Use bone, non_bone, all, deform, constraint, slot_color, attachment, draw_order or event.
boneFilter=boneId requires trackType bone or all; use targetId for non-bone tracks.
conflictingTarget=boneId and targetId must identify the same bone when both are supplied.
unknownTarget=Unknown animation target ID: {0}
channel=Unknown animation channel: {0}
text={0} must be a nonblank string of at most 64 characters.
uuid={0} must be a canonical UUID string.
