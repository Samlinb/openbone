description=事件制作：put_event_definition 按 eventId 新建或更新，省略载荷时保留已有默认值。put_event_keyframe 按显式 keyId 新建或更新，同一时刻可保留多个有序事件；省略载荷时保留已有键值，新键继承事件定义的默认值。time 单位为秒。kind=events 查询定义，trackType=event 查询关键帧。remove_keyframes 也接受事件、换图、绘制顺序和颜色关键帧 UUID。这些操作不能修改音频路径，已有音频引用保持不变。
object=应为对象。
field=未知字段：{0}
text={0} 必须是不超过 {1} 字符的字符串。
uuid={0} 必须是规范 UUID 字符串。
number={0} 必须是 {1} 到 {2} 之间的有限数值。
integer=intValue 必须是有符号32位整数。
unknownEvent=未知事件定义：{0}
name=事件名称必须含1–256字符，且无首尾空白。
audioRequired=非默认音量或声道平衡需要已有音频引用。
