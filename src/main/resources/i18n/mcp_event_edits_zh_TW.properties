description=事件製作：put_event_definition 依 eventId 建立或更新，省略載荷時保留既有預設值。put_event_keyframe 依明確 keyId 建立或更新，同時刻可保留多個有序事件；省略載荷時保留既有鍵值，新鍵繼承事件定義的預設值。time 單位為秒。kind=events 查詢定義，trackType=event 查詢關鍵影格。remove_keyframes 也接受事件、換圖、繪製順序與顏色關鍵影格 UUID。這些操作無法修改音訊路徑，既有音訊參照保持不變。
object=應為物件。
field=未知欄位：{0}
text={0} 必須是不超過 {1} 字元的字串。
uuid={0} 必須是標準 UUID 字串。
number={0} 必須是 {1} 到 {2} 之間的有限數值。
integer=intValue 必須是有號32位整數。
unknownEvent=未知事件定義：{0}
name=事件名稱必須含1–256字元，且無首尾空白。
audioRequired=非預設音量或聲道平衡需要既有音訊參照。
