description=Event authoring: put_event_definition upserts by eventId; omitted payload preserves existing defaults. put_event_keyframe upserts by explicit keyId, allowing distinct ordered events at the same time; omitted payload preserves an existing key or inherits definition defaults for a new key. time is seconds. Query kind=events for definitions and trackType=event for keys. remove_keyframes also accepts discrete event/attachment/draw-order/color key UUIDs. Audio paths cannot be changed by these operations; existing audio references are preserved.
