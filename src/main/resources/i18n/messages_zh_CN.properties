media.renderDescription=异步导出当前实时动画的完整 MP4，使用真实 GL 视口，通过原始 RGB 管道直接发送 FFmpeg，不逐帧编码 PNG 或 HTTP。需要 JVM 配置 openbone.ffmpeg。每编辑器同时一个任务，图像每边最多 1024 像素。默认 24 帧并包含终点，零时长姿势停留一秒。fit 默认 true，在后台从不可变工程快照计算动作范围边界，只取景一次后固定相机。fitTime 选择预览姿势，默认为中点。绝对输出目录必须尚不存在。版本检查和 MP4 解码后一起发布 animation.mp4、preview.png、proof.json。通过 openbone_render_status 查询；导出期间编辑和视口控制忙碌。重试必须保持相同 requestId 与参数。
media.statusDescription=查询异步动画导出。可选 waitMs（0-5000）在完成或超时时立即返回，包含帧进度、解码帧数和输出路径。
media.cancelDescription=取消异步动画导出。只清理本任务的暂存目录，保留既有输出与编辑历史。

