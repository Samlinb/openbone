mcp.sessionInstructions=操作当前 OpenBone 会话。使用前读取 tools/list 和上下文能力，宿主可能不提供预览或播放。编辑前先查询场景。使用准确 UUID、expectedRevision 和唯一 requestId，重试时保持参数完全一致。批量修改原子执行且可撤销。加载有未保存修改的工程时必须明确 dirtyPolicy。支持渲染时用 render_status 查询媒体任务；媒体导出期间修改和视图控制工具保持忙碌，直到完成或取消。
mcp.desktopPreviewDescription=跳转到准确秒数、暂停并将真实 GL 视口截取为 PNG，每边最多 1024 像素。可用 fit 对可见几何取景，showBones/showGrid 隐藏编辑辅助显示；这些选项保留在编辑器中。需要可见窗口。可截取多个时刻检查动作，不写入撤销历史。
