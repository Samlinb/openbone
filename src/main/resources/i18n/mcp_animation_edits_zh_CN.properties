description=在当前编辑器中原子构建和编辑场景，整批操作可一次撤销。支持骨骼、插槽、区域附件、动画及骨骼/约束/deform 关键帧。骨骼位移、旋转、切变相对 Setup，角度单位为度；缩放为倍率。put_constraint_keyframe 按查询返回的 components 顺序写入绝对参数。put_deform_keyframe 写入完整 XY Setup 偏移数组；加权附件每个影响项一对，使用影响骨骼局部空间，非加权附件使用插槽骨骼局部空间。按 deformSize/valueBindings 解释数据；路径修形应保留端点。可选 curve 指向下一关键帧，支持 linear、stepped 或归一化 bezier 对象。IK 开关始终阶梯变化。同目标、通道、时间替换保留关键帧 ID，省略曲线则保留已有曲线。remove_keyframes 支持骨骼、约束和 deform 关键帧 UUID。必须携带 expectedRevision，重试保持 requestId 和参数完全相同。
values=values 必须是非空数值数组，且不超过分量上限（约束 6，deform 65536）。
channel=未知约束通道。请使用查询契约返回的通道名称。
curve=curve 必须为 linear、stepped 或包含 kind、x1、y1、x2、y2 的 bezier 对象。
object=应提供对象。
field=未知字段：{0}
text={0} 必须为非空字符串，长度不超过 64 个字符。
uuid={0} 必须为规范的 UUID 字符串。
number={0} 必须为 {1} 至 {2} 之间的有限数值。
