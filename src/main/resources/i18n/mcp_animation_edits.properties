description=Build and edit the live scene atomically in one undo step. Supports bones, slots, regions, animations and bone/constraint/deform keyframes. Bone translation/rotation/shear are local Setup offsets (degrees); scale is a multiplier. put_constraint_keyframe writes absolute parameters in the query components order. put_deform_keyframe writes complete XY Setup offsets, per influence for weighted attachments in influence-bone local space; unweighted offsets use slot-bone local space. Use queried deformSize/valueBindings; preserve endpoint pairs when shaping paths. Optional curve describes the outgoing segment: linear, stepped or a normalized bezier object. IK flags remain stepped. Existing time/target replacement preserves key ID and omitted curves. remove_keyframes accepts bone/constraint/deform key UUIDs. Batches are atomic; use expectedRevision and retry with identical requestId/arguments. set_skin selects an existing skin by name, including its bone/constraint activation, as one undoable operation.
values=values must be a nonempty numeric array within the component limit (6 for constraints, 65536 for deform).
channel=Unknown constraint channel. Use the channel names returned by the query contract.
curve=curve must be linear, stepped or a bezier object with kind, x1, y1, x2 and y2.
object=Expected an object.
field=Unknown field: {0}
text={0} must be a nonblank string of at most 64 characters.
uuid={0} must be a canonical UUID string.
number={0} must be a finite number between {1} and {2}.
