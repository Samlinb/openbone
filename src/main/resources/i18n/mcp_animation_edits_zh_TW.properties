description=在目前編輯器中原子建立和編輯場景，整批操作可一次復原。支援骨骼、插槽、區域附件、動畫及骨骼/約束/deform 關鍵影格。骨骼位移、旋轉、切變相對 Setup，角度單位為度；縮放為倍率。put_constraint_keyframe 依查詢傳回的 components 順序寫入絕對參數。put_deform_keyframe 寫入完整 XY Setup 偏移陣列；加權附件每個影響項一對，使用影響骨骼局部空間，非加權附件使用插槽骨骼局部空間。依 deformSize/valueBindings 解釋資料；路徑修形應保留端點。可選 curve 指向下一關鍵影格，支援 linear、stepped 或正規化 bezier 物件。IK 開關始終階梯變化。同目標、通道、時間替換保留關鍵影格 ID，省略曲線則保留原有曲線。remove_keyframes 支援骨骼、約束和 deform 關鍵影格 UUID。必須攜帶 expectedRevision，重試保持 requestId 和參數完全相同。
values=values 必須是非空數值陣列，且不超過分量上限（約束 6，deform 65536）。
channel=未知約束通道。請使用查詢契約傳回的通道名稱。
curve=curve 必須為 linear、stepped 或包含 kind、x1、y1、x2、y2 的 bezier 物件。
object=應提供物件。
field=未知欄位：{0}
text={0} 必須為非空字串，長度不超過 64 個字元。
uuid={0} 必須為標準的 UUID 字串。
number={0} 必須為 {1} 至 {2} 之間的有限數值。
