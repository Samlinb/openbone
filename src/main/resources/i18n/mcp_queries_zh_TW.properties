description=依工程版本分頁讀取骨骼、動畫、關鍵影格、插槽、附件或約束。關鍵影格預設僅含骨骼軌道；trackType 可選 all、non_bone、bone、deform、constraint、slot_color、attachment、draw_order 或 event。targetId 和 channel 在分頁前篩選。ID 為 UUID，時間單位為秒。骨骼變換相對 Setup；deform 為局部 XY 偏移，加權資料每個影響項一對；約束與色彩為絕對值。曲線作用於至下一關鍵影格的區間。附件和繪製順序採階梯切換，事件瞬時觸發。 皮膚查詢傳回名稱、目前選擇及成員 boneIds/constraintIds；骨骼和約束包含 skinRequired/skinActive。皮膚以名稱識別，set_skin 可復原地切換皮膚。預設附件回退不會啟用預設皮膚的骨骼成員。
keyframeFilters=trackType、targetId 和 channel 僅適用於 kind 為 keyframes 的查詢。
trackType=未知 trackType。請使用 bone、non_bone、all、deform、constraint、slot_color、attachment、draw_order 或 event。
boneFilter=boneId 要求 trackType 為 bone 或 all；查詢非骨骼軌道請使用 targetId。
conflictingTarget=同時提供 boneId 和 targetId 時，兩者必須指向同一骨骼。
unknownTarget=未知動畫目標 ID：{0}
channel=未知動畫通道：{0}
text={0} 必須是非空字串，長度不超過 64 個字元。
uuid={0} 必須是標準的 UUID 字串。
