description=按工程版本分页读取骨骼、动画、关键帧、插槽、附件或约束。关键帧默认仅含骨骼轨道；trackType 可选 all、non_bone、bone、deform、constraint、slot_color、attachment、draw_order 或 event。targetId 和 channel 在分页前过滤。ID 为 UUID，时间单位为秒。骨骼变换相对 Setup；deform 为局部 XY 偏移，加权数据每个影响项一对；约束与颜色为绝对值。曲线作用于到下一关键帧的区间。附件和绘制顺序采用阶梯切换，事件瞬时触发。
keyframeFilters=trackType、targetId 和 channel 仅适用于 kind 为 keyframes 的查询。
trackType=未知 trackType。请使用 bone、non_bone、all、deform、constraint、slot_color、attachment、draw_order 或 event。
boneFilter=boneId 要求 trackType 为 bone 或 all；查询非骨骼轨道请使用 targetId。
conflictingTarget=同时提供 boneId 和 targetId 时，两者必须指向同一骨骼。
unknownTarget=未知动画目标 ID：{0}
channel=未知动画通道：{0}
text={0} 必须是非空字符串，长度不超过 64 个字符。
uuid={0} 必须是规范的 UUID 字符串。
